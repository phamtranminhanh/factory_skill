name: Test suite and installation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run evidence and dashboard tests
        run: python -m unittest discover -s tests -v
      - name: Install suite into a temporary directory
        run: python install.py --destination "$RUNNER_TEMP/factory-skills"
      - name: Check installed entry points
        run: |
          python "$RUNNER_TEMP/factory-skills/factory/scripts/factory_run.py" --help
          python "$RUNNER_TEMP/factory-skills/factory/scripts/factory_dashboard.py" --help
          python -c 'import os; from pathlib import Path; p = Path(os.environ["RUNNER_TEMP"]) / "factory-skills"; assert len(list(p.glob("*/SKILL.md"))) == 13'
